<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AERO-S 3D — 運動速克達互動試駕與空間展示</title>
  <style>
    :root {
      --bg-dark: #0b0d12;
      --panel-bg: rgba(16, 20, 28, 0.86);
      --border: rgba(255, 255, 255, 0.13);
      --accent-red: #e61e2a;
      --accent-cyan: #22d3ee;
      --accent-amber: #f59e0b;
      --accent-emerald: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container { width: 100%; height: 100%; position: absolute; inset: 0; }

    /* Top Header */
    .hud-header {
      position: absolute;
      top: 18px;
      left: 22px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent-red);
      padding: 12px 18px;
      border-radius: 10px;
      pointer-events: none;
    }
    .hud-header h1 {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-tcs {
      font-size: 11px;
      background: var(--accent-red);
      color: #fff;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 700;
    }
    .hud-header p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Digital Speedometer & Status Cluster */
    .hud-meter {
      position: absolute;
      top: 18px;
      right: 22px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      padding: 12px 20px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 280px;
      justify-content: space-between;
    }
    .turn-arrow {
      font-size: 22px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.15);
      transition: color 0.08s, text-shadow 0.08s;
    }
    .turn-arrow.active {
      color: var(--accent-amber);
      text-shadow: 0 0 12px var(--accent-amber);
    }
    .speed-box { text-align: center; }
    .speed-val {
      font-size: 34px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--accent-cyan);
      line-height: 1;
    }
    .speed-unit { font-size: 11px; color: var(--text-muted); letter-spacing: 0.08em; }
    .cargo-pill {
      font-size: 11px;
      color: #d1fae5;
      background: rgba(16, 185, 129, 0.18);
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 3px 8px;
      border-radius: 6px;
      margin-top: 4px;
      display: inline-block;
    }

    /* Bottom Interactive Control Deck */
    .hud-controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      padding: 11px 16px;
      border-radius: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: center;
      max-width: 96vw;
    }
    .ctrl-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .ctrl-btn:hover { background: rgba(255, 255, 255, 0.13); }
    .ctrl-btn.active {
      background: rgba(34, 211, 238, 0.18);
      border-color: var(--accent-cyan);
      color: #fff;
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.28);
    }
    .ctrl-btn.active-amber {
      background: rgba(245, 158, 11, 0.22);
      border-color: var(--accent-amber);
      color: #fff;
      box-shadow: 0 0 14px rgba(245, 158, 11, 0.32);
    }
    .ctrl-btn.active-red {
      background: rgba(230, 30, 42, 0.28);
      border-color: var(--accent-red);
      color: #fff;
      box-shadow: 0 0 14px rgba(230, 30, 42, 0.4);
    }
    .ctrl-btn.active-emerald {
      background: rgba(16, 185, 129, 0.22);
      border-color: var(--accent-emerald);
      color: #fff;
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.32);
    }
    .kbd {
      font-size: 11px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 1px 6px;
      border-radius: 4px;
      color: #cbd5e1;
      font-family: monospace;
    }
  </style>
  <!-- Cache-busting query string ensures latest 3D model is always loaded -->
  <script src="./model_data.js?v=20261103_v7"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud-header">
    <h1>AERO-S 3D <span class="badge-tcs">SPORT 運動版</span></h1>
    <p>W/S 前進煞車 ・ A/D 壓車過彎 ・ U 掀開坐墊 ・ B 放入收納盒 ・ V 騎士儀表視角</p>
  </div>

  <div class="hud-meter">
    <div id="ind-left" class="turn-arrow">◀</div>
    <div class="speed-box">
      <div id="speed-num" class="speed-val">0</div>
      <div class="speed-unit">KM/H</div>
      <div id="hud-cargo" class="cargo-pill">📦 車廂收納：0 / 3 盒</div>
    </div>
    <div id="ind-right" class="turn-arrow">▶</div>
  </div>

  <div class="hud-controls">
    <button id="btn-light" class="ctrl-btn active">
      <span>💡 車燈：<b id="light-label">近光燈</b></span> <span class="kbd">L</span>
    </button>
    <button id="btn-turn-l" class="ctrl-btn">
      <span>⬅ 左方向燈</span> <span class="kbd">Q</span>
    </button>
    <button id="btn-hazard" class="ctrl-btn">
      <span>⚠️ 雙黃燈</span> <span class="kbd">Z</span>
    </button>
    <button id="btn-turn-r" class="ctrl-btn">
      <span>➡ 右方向燈</span> <span class="kbd">E</span>
    </button>
    <button id="btn-brake" class="ctrl-btn">
      <span>🛑 煞車尾燈</span> <span class="kbd">Space</span>
    </button>
    <button id="btn-horn" class="ctrl-btn">
      <span>🔊 按喇叭</span> <span class="kbd">H</span>
    </button>
    <button id="btn-seat" class="ctrl-btn">
      <span>💺 坐墊車廂：<b id="seat-label">關閉</b></span> <span class="kbd">U</span>
    </button>
    <button id="btn-cargo" class="ctrl-btn">
      <span>📦 放貨方盒：<b id="cargo-label">0 / 3</b></span> <span class="kbd">B</span>
    </button>
    <button id="btn-cockpit" class="ctrl-btn">
      <span>👁️ 騎士儀表視角</span> <span class="kbd">V</span>
    </button>
    <button id="btn-cam" class="ctrl-btn">
      <span>🎥 鏡頭：<b id="cam-label">自由環繞</b></span> <span class="kbd">C</span>
    </button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // --- 1. Scene, Camera & Renderer ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0c0f16);
    scene.fog = new THREE.FogExp2(0x0c0f16, 0.028);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.04, 140);
    // Start at a dynamic 3/4 rear-left angle so Left/Right match the rider's perspective immediately
    camera.position.set(1.65, 1.12, -1.85);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.58, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.maxPolarAngle = Math.PI * 0.492;
    controls.minDistance = 0.45;
    controls.maxDistance = 9.0;

    // --- 2. Studio Lighting, Showroom Track Markings & Apex Pylons ---
    const hemiLight = new THREE.HemisphereLight(0xdbeafe, 0x1e293b, 1.45);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.2);
    dirLight.position.set(-4, 7, -5);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    scene.add(dirLight);

    const rimLight = new THREE.DirectionalLight(0x60a5fa, 1.15);
    rimLight.position.set(4, 3, 5);
    scene.add(rimLight);

    const groundGeo = new THREE.PlaneGeometry(240, 240);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x10141d, roughness: 0.78, metalness: 0.15 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const grid = new THREE.GridHelper(240, 120, 0x3b4d6b, 0x1e293b);
    grid.position.y = 0.002;
    scene.add(grid);

    // Showroom Test-Track Rings & Glowing Apex Cones (gives strong visual reference when cornering!)
    const trackGroup = new THREE.Group();
    scene.add(trackGroup);

    const ringRadii = [3.5, 7.5, 12.0];
    ringRadii.forEach((r, idx) => {
      const rGeo = new THREE.RingGeometry(r - 0.04, r + 0.04, 96);
      const rMat = new THREE.MeshBasicMaterial({
        color: idx === 1 ? 0x22d3ee : 0x334155,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: idx === 1 ? 0.45 : 0.3
      });
      const rMesh = new THREE.Mesh(rGeo, rMat);
      rMesh.rotation.x = -Math.PI / 2;
      rMesh.position.y = 0.004;
      trackGroup.add(rMesh);
    });

    // Add 12 glowing showroom track pylons around the 7.5m circle
    const pylonBodyGeo = new THREE.CylinderGeometry(0.035, 0.08, 0.42, 16);
    const pylonBaseGeo = new THREE.BoxGeometry(0.22, 0.03, 0.22);
    const pylonMat = new THREE.MeshStandardMaterial({
      color: 0xe61e2a,
      emissive: 0xe61e2a,
      emissiveIntensity: 0.45,
      roughness: 0.3
    });
    const pylonStripeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const pylonStripeGeo = new THREE.CylinderGeometry(0.048, 0.058, 0.09, 16);
    const pylonBaseMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });

    for (let i = 0; i < 12; i++) {
      const ang = (i / 12) * Math.PI * 2;
      const px = Math.cos(ang) * 7.5;
      const pz = Math.sin(ang) * 7.5;
      const pNode = new THREE.Group();
      pNode.position.set(px, 0, pz);

      const baseM = new THREE.Mesh(pylonBaseGeo, pylonBaseMat);
      baseM.position.y = 0.015;
      const bodyM = new THREE.Mesh(pylonBodyGeo, pylonMat);
      bodyM.position.y = 0.22;
      bodyM.castShadow = true;
      const stripeM = new THREE.Mesh(pylonStripeGeo, pylonStripeMat);
      stripeM.position.y = 0.26;

      pNode.add(baseM, bodyM, stripeM);
      trackGroup.add(pNode);
    }

    // --- 2B. Dynamic Tire Cornering Trail Ribbons (Front & Rear Tire Tracks) ---
    const TRAIL_MAX = 70;
    function createTireTrail(colorHex, width) {
      const positions = new Float32Array(TRAIL_MAX * 2 * 3);
      const colors = new Float32Array(TRAIL_MAX * 2 * 3);
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const indices = [];
      for (let i = 0; i < TRAIL_MAX - 1; i++) {
        const a = i * 2, b = a + 1, c = a + 2, d = a + 3;
        indices.push(a, b, c, b, d, c);
      }
      geo.setIndex(indices);

      const mat = new THREE.MeshBasicMaterial({
        vertexColors: true,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.55,
        depthWrite: false
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.frustumCulled = false;
      scene.add(mesh);

      return {
        mesh,
        geo,
        width,
        baseColor: new THREE.Color(colorHex),
        history: []
      };
    }

    const rearTrail = createTireTrail(0x22d3ee, 0.095);
    const frontTrail = createTireTrail(0xf59e0b, 0.065);

    function updateTireTrail(trail, worldPos, headingAngle) {
      const last = trail.history[0];
      if (!last || last.pos.distanceToSquared(worldPos) > 0.012) {
        trail.history.unshift({ pos: worldPos.clone(), heading: headingAngle });
        if (trail.history.length > TRAIL_MAX) trail.history.pop();
      }
      const posAttr = trail.geo.attributes.position;
      const colAttr = trail.geo.attributes.color;
      const count = trail.history.length;

      for (let i = 0; i < TRAIL_MAX; i++) {
        const sample = trail.history[Math.min(i, count - 1)] || { pos: worldPos, heading: headingAngle };
        const rx = Math.cos(sample.heading) * (trail.width * 0.5);
        const rz = -Math.sin(sample.heading) * (trail.width * 0.5);

        const fade = Math.max(0, 1 - i / Math.max(1, count - 1));
        const vIdx = i * 2;
        posAttr.setXYZ(vIdx, sample.pos.x - rx, 0.006, sample.pos.z - rz);
        posAttr.setXYZ(vIdx + 1, sample.pos.x + rx, 0.006, sample.pos.z + rz);

        colAttr.setXYZ(vIdx, trail.baseColor.r * fade, trail.baseColor.g * fade, trail.baseColor.b * fade);
        colAttr.setXYZ(vIdx + 1, trail.baseColor.r * fade, trail.baseColor.g * fade, trail.baseColor.b * fade);
      }
      posAttr.needsUpdate = true;
      colAttr.needsUpdate = true;
    }

    // --- 3. Web Audio API Synthesizer (Horn, Turn Relay, Seat Latch & Cargo Pack) ---
    let audioCtx = null;
    let hornOsc1 = null, hornOsc2 = null, hornGain = null;

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function startHornSound() {
      ensureAudio();
      if (hornOsc1) return;
      hornGain = audioCtx.createGain();
      hornGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      hornGain.gain.exponentialRampToValueAtTime(0.22, audioCtx.currentTime + 0.02);

      hornOsc1 = audioCtx.createOscillator();
      hornOsc2 = audioCtx.createOscillator();
      hornOsc1.type = 'sawtooth';
      hornOsc2.type = 'triangle';
      hornOsc1.frequency.setValueAtTime(420, audioCtx.currentTime);
      hornOsc2.frequency.setValueAtTime(512, audioCtx.currentTime);

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(950, audioCtx.currentTime);
      filter.Q.setValueAtTime(1.8, audioCtx.currentTime);

      hornOsc1.connect(filter);
      hornOsc2.connect(filter);
      filter.connect(hornGain);
      hornGain.connect(audioCtx.destination);
      hornOsc1.start();
      hornOsc2.start();
    }

    function stopHornSound() {
      if (!hornOsc1) return;
      try {
        hornOsc1.stop();
        hornOsc2.stop();
        hornOsc1.disconnect();
        hornOsc2.disconnect();
      } catch (e) {}
      hornOsc1 = null;
      hornOsc2 = null;
    }

    function playRelayTick(high = true) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(high ? 1150 : 780, audioCtx.currentTime);
      g.gain.setValueAtTime(0.06, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.025);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.028);
    }

    function playLatchSound(opening = true) {
      ensureAudio();
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(opening ? 320 : 240, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(opening ? 640 : 140, audioCtx.currentTime + 0.09);
      g.gain.setValueAtTime(0.12, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.10);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.11);
    }

    function playCargoSound(count) {
      ensureAudio();
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'triangle';
      const baseFreq = count > 0 ? 380 + count * 110 : 220;
      osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.35, audioCtx.currentTime + 0.08);
      g.gain.setValueAtTime(0.14, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.09);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.10);
    }

    // --- 4. 3D Dynamic TFT Dashboard Canvas Texture (512x256) ---
    const dashCanvas = document.createElement('canvas');
    dashCanvas.width = 512;
    dashCanvas.height = 256;
    const dashCtx = dashCanvas.getContext('2d');
    const dashTexture = new THREE.CanvasTexture(dashCanvas);
    dashTexture.colorSpace = THREE.SRGBColorSpace;
    dashTexture.flipY = false;

    function drawDashboardTFT(kmh, rpmRatio, leftOn, rightOn, lightMode, seatOpen, cargoCount) {
      const ctx = dashCtx;
      const w = 512, h = 256;

      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, '#050b14');
      grad.addColorStop(1, '#091322');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = 'rgba(34, 211, 238, 0.45)';
      ctx.lineWidth = 4;
      ctx.strokeRect(8, 8, w - 16, h - 16);

      // Top Indicator Bar
      ctx.font = '900 32px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillStyle = leftOn ? '#f59e0b' : 'rgba(255,255,255,0.12)';
      ctx.fillText('◀', 26, 44);

      ctx.textAlign = 'right';
      ctx.fillStyle = rightOn ? '#f59e0b' : 'rgba(255,255,255,0.12)';
      ctx.fillText('▶', w - 26, 44);

      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = lightMode >= 1 ? '#10b981' : 'rgba(255,255,255,0.15)';
      ctx.fillText('DRL', 145, 38);

      ctx.fillStyle = lightMode >= 2 ? '#22d3ee' : 'rgba(255,255,255,0.15)';
      ctx.fillText('LOW', 205, 38);

      ctx.fillStyle = lightMode === 3 ? '#3b82f6' : 'rgba(255,255,255,0.15)';
      ctx.fillText('≡HIGH', 275, 38);

      ctx.fillStyle = seatOpen ? '#ef4444' : 'rgba(255,255,255,0.15)';
      ctx.fillText(seatOpen ? '🔓TRUNK' : '🔒LOCK', 360, 38);

      // Dynamic Sweeping RPM Bar (22 segments)
      const totalBars = 22;
      const activeBars = Math.max(2, Math.round(rpmRatio * totalBars));
      for (let i = 0; i < totalBars; i++) {
        const bx = 28 + i * 20.8;
        const by = 58;
        const bw = 15;
        const bh = 18 + (i > 14 ? (i - 14) * 1.5 : 0);
        if (i < activeBars) {
          ctx.fillStyle = i >= 18 ? '#ef4444' : (i >= 14 ? '#f59e0b' : '#22d3ee');
        } else {
          ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        }
        ctx.fillRect(bx, by, bw, bh);
      }

      ctx.font = 'bold 12px monospace';
      ctx.fillStyle = '#64748b';
      ctx.textAlign = 'left';
      ctx.fillText('RPM x1000', 28, 94);
      for (let r = 2; r <= 10; r += 2) {
        ctx.fillText(String(r), 28 + (r / 10) * 420, 94);
      }

      // Left Zone: SPORT Mode & TCS
      ctx.fillStyle = 'rgba(230, 30, 42, 0.25)';
      ctx.fillRect(28, 112, 108, 42);
      ctx.strokeStyle = '#e61e2a';
      ctx.lineWidth = 2;
      ctx.strokeRect(28, 112, 108, 42);
      ctx.font = '900 22px sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.fillText('SPORT', 82, 141);

      ctx.font = 'bold 15px monospace';
      ctx.fillStyle = '#22d3ee';
      ctx.textAlign = 'left';
      ctx.fillText('TCS: ON', 30, 182);
      ctx.fillStyle = '#94a3b8';
      ctx.fillText('BAT: 14.2V', 30, 206);
      ctx.fillText('ODO: 0168km', 30, 230);

      // Center Zone: Giant Digital Speedometer
      ctx.font = '900 96px sans-serif';
      ctx.fillStyle = '#f8fafc';
      ctx.textAlign = 'center';
      ctx.fillText(String(kmh), 256, 196);

      ctx.font = 'bold 20px sans-serif';
      ctx.fillStyle = '#22d3ee';
      ctx.fillText('KM/H', 256, 228);

      // Right Zone: Fuel Gauge & Cargo Box Status
      ctx.font = 'bold 15px monospace';
      ctx.textAlign = 'right';
      ctx.fillStyle = '#10b981';
      ctx.fillText(`BOX: ${cargoCount}/3`, w - 28, 132);

      for (let c = 0; c < 3; c++) {
        ctx.fillStyle = c < cargoCount ? '#10b981' : 'rgba(255,255,255,0.12)';
        ctx.fillRect(w - 116 + c * 30, 144, 24, 18);
      }

      ctx.fillStyle = '#94a3b8';
      ctx.fillText('FUEL', w - 28, 192);
      for (let f = 0; f < 5; f++) {
        ctx.fillStyle = f < 4 ? '#22d3ee' : 'rgba(255,255,255,0.15)';
        ctx.fillRect(w - 128 + f * 20, 204, 16, 14);
      }

      dashTexture.needsUpdate = true;
    }

    // --- 5. Load Vehicle GLB & Bind Rig Nodes ---
    let vehicleRoot = null, steerPivot = null, frontWheel = null, rearWheel = null, seatPivot = null;
    let hornBtnObj = null, brakeLeverObj = null;
    const cargoBoxes = [null, null, null];
    const cargoBaseY = [0, 0, 0];
    const lightMats = { drl: null, low: null, high: null, turnL: null, turnR: null, tail: null };
    let headSpotLight = null, headSpotTarget = null;
    let hornRingMesh = null;

    function base64ToArrayBuffer(b64) {
      const bin = atob(b64);
      const len = bin.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
      return bytes.buffer;
    }

    const loader = new GLTFLoader();
    const glbB64 = window.VEHICLE_GLB_BASE64 || window['KYMCO_GLB_BASE64'] || window.MODEL_BASE64;
    if (glbB64) {
      const buf = base64ToArrayBuffer(glbB64);
      loader.parse(buf, '', (gltf) => {
        vehicleRoot = gltf.scene;
        scene.add(vehicleRoot);

        let fallbackSeatMesh = null;
        vehicleRoot.traverse((node) => {
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
            if (node.material) {
              const mName = node.material.name || '';
              if (mName.includes('MAT_Light_DRL')) lightMats.drl = node.material;
              if (mName.includes('MAT_Light_LowBeam')) lightMats.low = node.material;
              if (mName.includes('MAT_Light_HighBeam')) lightMats.high = node.material;
              if (mName.includes('MAT_Light_Turn_L')) lightMats.turnL = node.material;
              if (mName.includes('MAT_Light_Turn_R')) lightMats.turnR = node.material;
              if (mName.includes('MAT_Light_TailBrake')) lightMats.tail = node.material;
              if (mName.includes('MAT_Dashboard_TFT') || mName.includes('MAT_LCD_Screen') || node.name === 'Vehicle_Dashboard_Screen') {
                node.material = new THREE.MeshStandardMaterial({
                  map: dashTexture,
                  emissive: new THREE.Color(0xffffff),
                  emissiveMap: dashTexture,
                  emissiveIntensity: 1.15,
                  roughness: 0.15,
                  metalness: 0.1
                });
              }
            }
          }
          if (node.name === 'Steering_Pivot') steerPivot = node;
          if (node.name === 'Front_Wheel_Pivot') frontWheel = node;
          if (node.name === 'Rear_Wheel_Pivot') rearWheel = node;
          if (node.name === 'Seat_Pivot') seatPivot = node;
          if (node.name === 'Vehicle_Sport_Seat') fallbackSeatMesh = node;
          if (node.name === 'Cargo_Box_1') { cargoBoxes[0] = node; cargoBaseY[0] = node.position.y; }
          if (node.name === 'Cargo_Box_2') { cargoBoxes[1] = node; cargoBaseY[1] = node.position.y; }
          if (node.name === 'Cargo_Box_3') { cargoBoxes[2] = node; cargoBaseY[2] = node.position.y; }
          if (node.name.endsWith('Horn_Button')) hornBtnObj = node;
          if (node.name.endsWith('Brake_Levers')) brakeLeverObj = node;
        });

        // Fallback pivot wrapper in case an older cached GLB without Seat_Pivot was loaded
        if (!seatPivot && fallbackSeatMesh && fallbackSeatMesh.parent) {
          seatPivot = new THREE.Group();
          seatPivot.position.set(0, 0.602, 0.058);
          fallbackSeatMesh.parent.add(seatPivot);
          fallbackSeatMesh.position.sub(seatPivot.position);
          seatPivot.add(fallbackSeatMesh);
        }

        for (let i = 0; i < 3; i++) {
          if (cargoBoxes[i]) {
            cargoBoxes[i].visible = false;
            cargoBoxes[i].scale.setScalar(0.01);
          }
        }

        // Attach real 3D Headlight SpotLight
        headSpotLight = new THREE.SpotLight(0xe0f2fe, 12.0, 28, Math.PI * 0.24, 0.45, 1.2);
        headSpotLight.position.set(0, 0.56, 0.66);
        headSpotLight.castShadow = true;
        headSpotTarget = new THREE.Object3D();
        headSpotTarget.position.set(0, 0.05, 7.5);
        vehicleRoot.add(headSpotLight);
        vehicleRoot.add(headSpotTarget);
        headSpotLight.target = headSpotTarget;

        // Visual Horn Sonic Wave Ring
        const ringGeo = new THREE.RingGeometry(0.08, 0.11, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xfacc15, side: THREE.DoubleSide, transparent: true, opacity: 0 });
        hornRingMesh = new THREE.Mesh(ringGeo, ringMat);
        hornRingMesh.position.set(0, 0.62, 0.72);
        vehicleRoot.add(hornRingMesh);

        applyLightState();
        drawDashboardTFT(0, 0.1, false, false, lightMode, seatOpen, cargoCount);
      });
    }

    // --- 6. Interactive States (Lights, Turn Signals, Seat Trunk, Cargo Boxes, Camera) ---
    let lightMode = 2; // 0: Off, 1: DRL, 2: Low Beam, 3: High Beam
    const lightLabels = ['全關', '日行燈', '近光燈', '遠近全開'];
    let turnMode = 0;  // 0: Off, -1: Left, 1: Right, 2: Hazard
    let brakeActive = false;
    let hornActive = false;
    let seatOpen = false;
    let seatAngle = 0;
    let cargoCount = 0;
    const cargoScale = [0, 0, 0];
    let camMode = 0;   // 0: Free Orbit (with dynamic cornering lag!), 1: Close Chase, 2: Cockpit Dashboard View
    const camLabels = ['自由環繞', '動態追焦', '騎士儀表'];

    function setEmissive(mat, colorHex, intensity) {
      if (!mat) return;
      mat.emissive = new THREE.Color(colorHex);
      mat.emissiveIntensity = intensity;
    }

    function applyLightState() {
      const btnLight = document.getElementById('btn-light');
      document.getElementById('light-label').textContent = lightLabels[lightMode];
      btnLight.classList.toggle('active', lightMode > 0);

      setEmissive(lightMats.drl, 0xe0f2fe, lightMode >= 1 ? 3.5 : 0.0);
      setEmissive(lightMats.low, 0xe0f2fe, lightMode >= 2 ? 6.0 : 0.05);
      setEmissive(lightMats.high, 0xffffff, lightMode === 3 ? 9.0 : 0.02);

      if (headSpotLight && headSpotTarget) {
        if (lightMode <= 1) {
          headSpotLight.intensity = 0;
        } else if (lightMode === 2) {
          headSpotLight.intensity = 16;
          headSpotLight.angle = Math.PI * 0.24;
          headSpotTarget.position.set(0, 0.02, 7.0);
        } else {
          headSpotLight.intensity = 32;
          headSpotLight.angle = Math.PI * 0.30;
          headSpotTarget.position.set(0, 0.35, 14.0);
        }
      }

      const tailInt = brakeActive ? 8.5 : (lightMode >= 1 ? 1.8 : 0.0);
      setEmissive(lightMats.tail, 0xff1122, tailInt);
      document.getElementById('btn-brake').classList.toggle('active-red', brakeActive);
    }

    function updateTurnUI() {
      document.getElementById('btn-turn-l').classList.toggle('active-amber', turnMode === -1);
      document.getElementById('btn-turn-r').classList.toggle('active-amber', turnMode === 1);
      document.getElementById('btn-hazard').classList.toggle('active-amber', turnMode === 2);
      if (turnMode === 0) {
        setEmissive(lightMats.turnL, 0xff7700, 0.0);
        setEmissive(lightMats.turnR, 0xff7700, 0.0);
        document.getElementById('ind-left').classList.remove('active');
        document.getElementById('ind-right').classList.remove('active');
      }
    }

    function toggleSeat(forceState) {
      seatOpen = (typeof forceState === 'boolean') ? forceState : !seatOpen;
      playLatchSound(seatOpen);
      document.getElementById('seat-label').textContent = seatOpen ? '開啟' : '關閉';
      document.getElementById('btn-seat').classList.toggle('active-amber', seatOpen);

      if (seatOpen && camMode === 0 && vehicleRoot) {
        const sideView = new THREE.Vector3(1.15, 1.28, -0.35).applyAxisAngle(new THREE.Vector3(0, 1, 0), heading);
        camera.position.copy(vehicleRoot.position).add(sideView);
        controls.target.copy(vehicleRoot.position).add(new THREE.Vector3(0, 0.65, -0.15));
        controls.update();
      }
    }

    function cycleCargo() {
      cargoCount = (cargoCount + 1) % 4;
      if (cargoCount > 0 && !seatOpen) {
        toggleSeat(true);
      }
      playCargoSound(cargoCount);
      document.getElementById('cargo-label').textContent = `${cargoCount} / 3`;
      document.getElementById('hud-cargo').textContent = `📦 車廂收納：${cargoCount} / 3 盒`;
      document.getElementById('btn-cargo').classList.toggle('active-emerald', cargoCount > 0);
    }

    function setCameraMode(newMode) {
      camMode = newMode;
      document.getElementById('cam-label').textContent = camLabels[camMode];
      document.getElementById('btn-cam').classList.toggle('active', camMode === 1);
      document.getElementById('btn-cockpit').classList.toggle('active', camMode === 2);
      if (camMode === 0 && vehicleRoot) {
        const defaultOrbit = new THREE.Vector3(1.55, 1.10, -1.75).applyAxisAngle(new THREE.Vector3(0, 1, 0), heading);
        camera.position.copy(vehicleRoot.position).add(defaultOrbit);
        controls.target.set(vehicleRoot.position.x, 0.58, vehicleRoot.position.z);
        controls.update();
      }
    }

    // --- 7. Input Handling (Keyboard & UI Buttons) ---
    const keys = { w: false, a: false, s: false, d: false };

    function cycleLight() {
      ensureAudio();
      lightMode = (lightMode + 1) % 4;
      applyLightState();
    }
    function toggleTurn(mode) {
      ensureAudio();
      turnMode = (turnMode === mode) ? 0 : mode;
      updateTurnUI();
    }
    function setBrake(state) {
      brakeActive = state;
      if (brakeLeverObj) brakeLeverObj.rotation.y = state ? 0.18 : 0.0;
      applyLightState();
    }
    function setHorn(state) {
      hornActive = state;
      document.getElementById('btn-horn').classList.toggle('active-amber', state);
      if (hornBtnObj) hornBtnObj.position.z = state ? -0.004 : 0.0;
      if (state) startHornSound(); else stopHornSound();
    }

    document.getElementById('btn-light').addEventListener('click', cycleLight);
    document.getElementById('btn-turn-l').addEventListener('click', () => toggleTurn(-1));
    document.getElementById('btn-turn-r').addEventListener('click', () => toggleTurn(1));
    document.getElementById('btn-hazard').addEventListener('click', () => toggleTurn(2));
    document.getElementById('btn-seat').addEventListener('click', () => toggleSeat());
    document.getElementById('btn-cargo').addEventListener('click', cycleCargo);
    document.getElementById('btn-cockpit').addEventListener('click', () => setCameraMode(camMode === 2 ? 0 : 2));
    document.getElementById('btn-cam').addEventListener('click', () => setCameraMode((camMode + 1) % 3));

    const btnBrake = document.getElementById('btn-brake');
    btnBrake.addEventListener('mousedown', () => setBrake(true));
    btnBrake.addEventListener('mouseup', () => setBrake(false));
    btnBrake.addEventListener('mouseleave', () => setBrake(false));

    const btnHorn = document.getElementById('btn-horn');
    btnHorn.addEventListener('mousedown', () => setHorn(true));
    btnHorn.addEventListener('mouseup', () => setHorn(false));
    btnHorn.addEventListener('mouseleave', () => setHorn(false));

    window.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') keys.w = true;
      if (k === 's' || e.key === 'ArrowDown') { keys.s = true; setBrake(true); }
      if (k === 'a' || e.key === 'ArrowLeft') keys.a = true;
      if (k === 'd' || e.key === 'ArrowRight') keys.d = true;
      if (e.code === 'Space') setBrake(true);
      if (k === 'l') cycleLight();
      if (k === 'q') toggleTurn(-1);
      if (k === 'e') toggleTurn(1);
      if (k === 'z') toggleTurn(2);
      if (k === 'h') setHorn(true);
      if (k === 'u') toggleSeat();
      if (k === 'b') cycleCargo();
      if (k === 'v') setCameraMode(camMode === 2 ? 0 : 2);
      if (k === 'c') setCameraMode((camMode + 1) % 3);
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'w' || e.key === 'ArrowUp') keys.w = false;
      if (k === 's' || e.key === 'ArrowDown') { keys.s = false; setBrake(false); }
      if (k === 'a' || e.key === 'ArrowLeft') keys.a = false;
      if (k === 'd' || e.key === 'ArrowRight') keys.d = false;
      if (e.code === 'Space') setBrake(false);
      if (k === 'h') setHorn(false);
    });

    // --- 8. Physics, Cornering Trails, Spring-Lag Camera & Render Loop ---
    let speed = 0;        // m/s
    let steerAngle = 0;   // radians
    let heading = 0;      // radians
    let blinkTimer = 0;
    let blinkOn = false;
    const camAnchor = new THREE.Vector3(0, 0, 0);
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      // Driving & Steering Physics
      if (keys.w) speed = Math.min(speed + 8.5 * dt, 26.0);
      else if (keys.s || brakeActive) speed = Math.max(speed - 15.0 * dt, -3.5);
      else speed *= (1 - 1.25 * dt);
      if (Math.abs(speed) < 0.05 && !keys.w && !keys.s) speed = 0;

      const targetSteer = (keys.a ? 0.46 : 0) + (keys.d ? -0.46 : 0);
      steerAngle += (targetSteer - steerAngle) * Math.min(1, 10 * dt);

      const kmh = Math.round(Math.abs(speed) * 3.6);
      document.getElementById('speed-num').textContent = kmh;

      if (vehicleRoot) {
        const turnRate = steerAngle * (speed * 0.42);
        if (Math.abs(speed) > 0.05) {
          heading += turnRate * dt;
        }
        vehicleRoot.rotation.y = heading;

        // Expressive cornering lean angle!
        const targetLean = -steerAngle * Math.min(Math.abs(speed) / 11.0, 1.0) * 0.58;
        vehicleRoot.rotation.z += (targetLean - vehicleRoot.rotation.z) * Math.min(1, 9 * dt);

        const moveDist = speed * dt;
        vehicleRoot.position.x += Math.sin(heading) * moveDist;
        vehicleRoot.position.z += Math.cos(heading) * moveDist;

        // Keep infinite grid centered near scooter (snapped to 2m cell size so grid lines visibly scroll!)
        grid.position.x = Math.floor(vehicleRoot.position.x / 2) * 2;
        grid.position.z = Math.floor(vehicleRoot.position.z / 2) * 2;
        ground.position.x = vehicleRoot.position.x;
        ground.position.z = vehicleRoot.position.z;

        // Update Front & Rear Tire Cornering Trail Ribbons
        const rearWheelWorld = new THREE.Vector3(0, 0, -0.60).applyAxisAngle(new THREE.Vector3(0, 1, 0), heading).add(vehicleRoot.position);
        const frontWheelWorld = new THREE.Vector3(0, 0, 0.68).applyAxisAngle(new THREE.Vector3(0, 1, 0), heading).add(vehicleRoot.position);
        updateTireTrail(rearTrail, rearWheelWorld, heading);
        updateTireTrail(frontTrail, frontWheelWorld, heading + steerAngle * 0.6);

        // Rotate Handlebar/Fork around local Y axis
        if (steerPivot) steerPivot.rotation.y = steerAngle;

        // Spin Front & Rear Wheels around local X axis
        const wheelSpin = (moveDist / 0.242);
        if (frontWheel) frontWheel.rotation.x += wheelSpin;
        if (rearWheel) rearWheel.rotation.x += wheelSpin;

        // Smoothly animate articulated Seat_Pivot (0 -> +0.96 rad = 55 deg open)
        if (seatPivot) {
          const targetSeatRot = seatOpen ? 0.96 : 0.0;
          seatAngle += (targetSeatRot - seatAngle) * Math.min(1, 9 * dt);
          seatPivot.rotation.x = seatAngle;
        }

        // Smoothly animate standardized Cargo Boxes inside under-seat trunk
        for (let i = 0; i < 3; i++) {
          const box = cargoBoxes[i];
          if (!box) continue;
          const active = i < cargoCount;
          const targetS = active ? 1.0 : 0.0;
          cargoScale[i] += (targetS - cargoScale[i]) * Math.min(1, 11 * dt);
          if (cargoScale[i] < 0.02 && !active) {
            box.visible = false;
          } else {
            box.visible = true;
            const s = Math.max(0.02, cargoScale[i]);
            box.scale.setScalar(s);
            box.position.y = cargoBaseY[i] + (1.0 - s) * 0.14;
          }
        }

        // Horn sonic wave animation
        if (hornRingMesh) {
          if (hornActive) {
            const t = (performance.now() * 0.005) % 1;
            hornRingMesh.scale.setScalar(1 + t * 4.5);
            hornRingMesh.material.opacity = (1 - t) * 0.75;
          } else {
            hornRingMesh.material.opacity = 0;
          }
        }

        // --- Dynamic Spring-Lag Camera System (gives real cornering & carving feel!) ---
        if (camMode === 0) {
          // Centrifugal lateral offset + forward lead so the scooter visibly carves across the screen when turning!
          const lateralShift = -steerAngle * Math.min(Math.abs(speed) / 12.0, 1.0) * 0.42;
          const forwardLead = Math.min(speed / 18.0, 1.0) * 0.28;
          const desiredAnchor = new THREE.Vector3(lateralShift, 0, forwardLead)
            .applyAxisAngle(new THREE.Vector3(0, 1, 0), heading)
            .add(vehicleRoot.position);

          const prevAnchorX = camAnchor.x;
          const prevAnchorZ = camAnchor.z;
          // Spring damping follow (0.10): bike surges ahead/into the turn first, camera smoothly catches up!
          camAnchor.lerp(desiredAnchor, Math.min(1, 7.5 * dt));
          const adx = camAnchor.x - prevAnchorX;
          const adz = camAnchor.z - prevAnchorZ;

          camera.position.x += adx;
          camera.position.z += adz;
          controls.target.x += adx;
          controls.target.z += adz;

          // Gentle partial yaw follow when turning so you feel the circular orbit sweep!
          if (Math.abs(turnRate) > 0.01) {
            const relCam = camera.position.clone().sub(controls.target);
            relCam.applyAxisAngle(new THREE.Vector3(0, 1, 0), turnRate * dt * 0.45);
            camera.position.copy(controls.target).add(relCam);
          }

          controls.update();
        } else if (camMode === 1) {
          // Dynamic racing chase camera with centrifugal swing
          const swingX = -steerAngle * Math.min(Math.abs(speed) / 12.0, 1.0) * 0.48;
          const offset = new THREE.Vector3(swingX, 1.06, -1.72).applyAxisAngle(new THREE.Vector3(0, 1, 0), heading);
          camera.position.lerp(vehicleRoot.position.clone().add(offset), Math.min(1, 9.5 * dt));
          const lookAtPt = vehicleRoot.position.clone().add(
            new THREE.Vector3(steerAngle * 0.55, 0.64, 1.15).applyAxisAngle(new THREE.Vector3(0, 1, 0), heading)
          );
          camera.lookAt(lookAtPt);
        } else if (camMode === 2) {
          // First-Person Rider Dashboard Cockpit View (tilts slightly with bike lean!)
          const eyeOffset = new THREE.Vector3(-vehicleRoot.rotation.z * 0.25, 1.13, -0.05).applyAxisAngle(new THREE.Vector3(0, 1, 0), heading);
          camera.position.copy(vehicleRoot.position).add(eyeOffset);
          const forwardPt = vehicleRoot.position.clone().add(
            new THREE.Vector3(steerAngle * 0.38 - vehicleRoot.rotation.z * 0.35, 0.89, 0.90).applyAxisAngle(new THREE.Vector3(0, 1, 0), heading)
          );
          camera.lookAt(forwardPt);
        }
      }

      // Turn Signal Blinker Loop
      let onL = false, onR = false;
      if (turnMode !== 0) {
        blinkTimer += dt;
        if (blinkTimer >= 0.34) {
          blinkTimer = 0;
          blinkOn = !blinkOn;
          playRelayTick(blinkOn);
        }
        onL = blinkOn && (turnMode === -1 || turnMode === 2);
        onR = blinkOn && (turnMode === 1 || turnMode === 2);
        setEmissive(lightMats.turnL, 0xff8800, onL ? 6.5 : 0.0);
        setEmissive(lightMats.turnR, 0xff8800, onR ? 6.5 : 0.0);
        document.getElementById('ind-left').classList.toggle('active', onL);
        document.getElementById('ind-right').classList.toggle('active', onR);
      }

      // Update live 3D TFT Dashboard CanvasTexture every frame
      const rpmRatio = Math.min(1.0, 0.12 + (Math.abs(speed) / 26.0) * 0.82 + (keys.w ? 0.08 : 0));
      drawDashboardTFT(kmh, rpmRatio, onL, onR, lightMode, seatOpen, cargoCount);

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
